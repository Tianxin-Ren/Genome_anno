# project_root: "/dssg/home/acct-schhui/gses0/rentianxin"


# 2. Sample Datasets (Multi-Sample Batch Annotation)
# Each sample defined below will be annotated into its dedicated subfolder:
#   - results/mag_annotation/{sample}/
#   - results/pathway_reconstruction/{sample}/
#
# By default, all defined samples are processed.
# To run ONLY a specific sample, pass on CLI: --config sample=hadar_Ytt
# (or uncomment below to lock to a single sample):
sample: "hydrogenase_evidence_genomes"

