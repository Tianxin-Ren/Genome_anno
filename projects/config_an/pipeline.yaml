# ==============================================================================
# 1. Data Configuration (Input Samples & External Resources)
# ==============================================================================
data:
  samples: "./samples.yaml"

# ==============================================================================
# 2. Workflow Modules (Logical Steps & Toggles)
# ==============================================================================
# 本文件夹 config_an 专为对 standalone assembly/genome 进行 Bakta + Unified HMM 注释设计
modules:
  preprocess:
    path: "./preprocess.yaml"
    enable: False
  assembly:
    path: "./assembly.yaml"
    enable: True        # 保持 True 以支持 Strategy 2 导入和过滤 external_assembly (无 Read 时不跑 Megahit)
  binning:
    path: "./binning.yaml"
    enable: False
  annotation:
    path: "./annotation.yaml"
    enable: True        # 开启注释
  advanced_analysis:
    path: "./advanced_analysis.yaml"
    enable: False
  hmm_build:
    path: "./hmm_build.yaml"
    enable: False
  plasmid_analysis:
    path: "./plasmid_analysis.yaml"
    enable: False
  abundance:
    path: "./abundance.yaml"
    enable: False
  data_prep:
    path: "./data_prep.yaml"
    enable: False

# ==============================================================================
# 3. Global Paths & Environment Setup
# ==============================================================================
project_root: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin"
conda_env_dir: "/dssg/home/acct-clswfp/clswfp-icdli1/.conda/envs/"
