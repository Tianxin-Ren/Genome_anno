# Standalone Annotation Configuration (config_an)
# 仅用于对独立基因组或组装文件进行 Bakta + Unified HMM 快速检索与注释
annotation:
  data_type: "long"
  input_dir: "results/assembly"
  
  steps:
    bakta: True          # 必须开启以进行基因预测生成 .faa
    eggnog: False
    kofamscan: False
    dbcan: False
    gtdbtk: False
    checkm2: False
    quast: False
    isescan: False
    advanced_hmm: True   # 开启 HMM 仲裁流程
    resolve_hmm: True    # 新增：是否进行最终 HMM 裁决与合并汇总。设为 False 则全局所有样本只跑 HMM 检索（生成 unified_all_raw.tbl）而不进行最终裁决与汇总
    pfam: False          # 默认关闭 Pfam (节省大量时间)，仅注释 Unified HMM
    circular: False      # 关闭环状精细化分析 (独立注释组装不需要此步骤)
    cdhit: True          # 新增：是否对合并后的 FAA 蛋白序列进行 CD-HIT 聚类得到代表性蛋白
  
  # --- Bakta Performance Settings ---
  split_chunks: 50
  ext_bakta_extra_flags: "--skip-sorf" # 跳过 sORF 预测以规避 DIAMOND v2.1.9 段错误崩溃。如需极速仅预测 CDS 可扩展为: "--skip-trna --skip-rrna --skip-tmrna --skip-ncrna --skip-ncrna-region --skip-crispr --skip-sorf --skip-pseudo --skip-gap --skip-ori"
  hmm_split_chunks: 50
  hmm_evalue_threshold: 1e-2
  hmm_log_factor: 0.2
  min_circular_size: 800000
  cdhit_c: 0.95       # 新增：CD-HIT 聚类相似性阈值参数 (如 0.95, 0.90 等)，结果文件名会自动包含此参数并自动调整 word size
  
  # --- Databases ---
  # bakta_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/Bakta/db"
  bakta_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/Bakta/db-light"
  gtdbtk_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/GTDB/archive/gtdb-tk/release232"
  checkm2_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/CheckM2_database/uniref100.KO.1.dmnd"
  eggnog_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/eggnog"
  kofam_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/kofam"
  dbcan_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/dbscan"
  
  # --- Advanced HMM Databases ---
  unified_hmm_db: 
   - "/dssg/home/acct-clswfp/clswfp-icdli1/Database/KEGG/archive/2025-02-28/cluster/all_lab_ATP/all_lab_ATP.hmm"
   - "/dssg/home/acct-clswfp/clswfp-icdli1/Database/HydDB/hmm_profiles"
  combined_hmm_name: "all_mtg_ATPase_hyd"
  pfam_hmm_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/Pfam/archive/37.4/Pfam-A.hmm"
  ko_list: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/kofam/ko_list"
  
  # --- Environments ---
  conda_envs:
    bakta: "bakta_1.12.0"
    checkm2: "checkm2_1.0.2"
    eggnog: "eggnog-mapper"
    kofamscan: "kofamscan"
    dbcan: "dbcan"
    quast: "quast_5.3.0"
    isescan: "isescan"
    biopython: "biopython_1.85"
    seqkit: "seqkit"
    cdhit: "cd-hit_4.8.1"
