    #   - "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/results/annotation/Hadar_Ytt/circular_bins_filtered/u1202559.fa"
    #   - "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/results/annotation/Hadar_Ytt/circular_bins_filtered/u499975.fa"

