  "hadarchaeota":
    hmm_profile: "Archaea"     # HMM profile for GToTree (e.g., Bacteria, Archaea, Universal, etc.)
    
    # --- Input Genome Specifications (Paths can be absolute, or relative to project_root) ---
    # Option 1: File containing absolute or relative genome paths (one per line)
    # genome_path_tsv: "Mpf_2022/MOB_abundance/data/gtotree_genome_path.tsv"
    
    # Option 2: List of directories to automatically scan for genomes (scans fna, fasta, fa and their .gz files)
    genomes_dirs:
      - "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/results/data_prep/hadarchaeota_gtdb_all/genomes"
      - "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/data/Hadar_ref"
    
    # Option 3: List of individual genome files (or glob patterns)
    # genome_files:
