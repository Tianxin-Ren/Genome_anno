# Binning & Circular Extraction Module Configuration (config_lr)
binning:
  mode: "hybrid"

  # Core Steps
  steps:
    extract_circular: True # Parses Myloasm headers (circular-yes/depth) and extracts circular contigs
    metawrap: False        # Disable second-generation short-read binning by default
    semibin2: False        # Optional: enable if performing metagenomic binning on long reads
    refinement: False
    drep: False

  # Thresholds for MAG / Binning Quality
  completeness: 50
  contamination: 10
  ani_threshold: 0.95

  # CheckM Database (for legacy MetaWRAP refinement if enabled)
  checkm_db: "/dssg/home/acct-clswfp/clswfp-icdli1/Database/checkm_data"

  conda_envs:
    metawrap: "metawrap_1.3.2"
    semibin2: "semibin2"
    mapping: "bio"
    drep: "bio"
