# ==============================================================================
# Master Pipeline Configuration (config_lr)
# ==============================================================================
# This configuration is optimized specifically for Oxford Nanopore (ONT) / HiFi
# third-generation long-read de novo assembly (Myloasm) and downstream analysis.
#
# Supported Workflows:
#   1. Quality Control: NanoPlot read quality and length profiling.
#   2. De Novo Assembly: Myloasm metagenomic / isolate long-read assembly.
#   3. Circular Extraction & MAG Analysis: Auto-extraction of circular chromosomes/plasmids.
#   4. Dual-track Genome Annotation:
#      - Track A: Assembly-level comprehensive annotation (Bakta + EggNOG + HMM).
#      - Track B: Refined circular chromosome/MAG profiling (CheckM2 + GTDB-Tk + Bakta --complete).
#   5. Plasmid & Mobile Elements: geNomad end-to-end plasmid & virus identification.
#   6. Abundance Quantification (Optional): RNA-seq / short-read re-mapping.

# ==============================================================================
# 1. Platform & Runtime Architecture
# ==============================================================================
runtime:
  platform: "config/platforms/slurm.yaml"

# ==============================================================================
# 2. Data Configuration (Input Samples & External Resources)
# ==============================================================================
data:
  samples: "./samples.yaml"

# ==============================================================================
# 2. Workflow Modules (Logical Steps & Toggles)
# ==============================================================================
modules:
  preprocess:
    path: "./preprocess.yaml"
    enable: True

  assembly:
    path: "./assembly.yaml"
    enable: True

  binning:
    path: "./binning.yaml"
    enable: True

  annotation:
    path: "./annotation.yaml"
    enable: True

  plasmid_analysis:
    path: "./plasmid_analysis.yaml"
    enable: False

  abundance:
    path: "./abundance.yaml"
    enable: False

# ==============================================================================
# 3. Global Paths & Environment Setup
# ==============================================================================
project_root: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin"
conda_env_dir: "/dssg/home/acct-clswfp/clswfp-icdli1/.conda/envs/"
