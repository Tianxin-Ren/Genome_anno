# Assembly Module Configuration (config_lr)
# Optimized for Oxford Nanopore Technologies (ONT) & PacBio HiFi via Myloasm
assembly:
  enable: True
  min_len: 1000
  steps:
    megahit: False
    myloasm: True

  # Optional extra command-line flags passed directly to myloasm
  # Examples:
  #   ONT R10.4.1 / Simplex / Duplex: extra: "--nano-r10"
  #   Read length / quality filtering: extra: "--min-length 1000 --min-read-qual 10"
  #   PacBio HiFi: extra: "--hifi"
  extra: ""

  conda_envs:
    myloasm: "myloasm_0.5.0"
    megahit: "megahit_1.2.9"
    bio: "bio"
