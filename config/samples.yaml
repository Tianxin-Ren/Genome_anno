# ------------------------------------------------------------------------------
# 6. Samples with External Assembly (Skip Assembly, go to Binning & Annotation)
# ------------------------------------------------------------------------------
# 示例一：【仅注释模式 (最推荐)】如果你有 20+ 个组装好的 FASTA，只想跑 Bakta + Unified HMM，
# 建议直接在上面的 `external_genomes` 下添加，无需提供测序 read，速度极快：
#
# external_genomes:
#   Bathy_Assembly_1:
#     path: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/data/my_assemblies/assembly1.fa"
#     complete: false
#   Bathy_Assembly_2:
#     path: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/data/my_assemblies/assembly2.fa"
#     complete: false
#
# ------------------------------------------------------------------------------
# 示例二：【混合分析模式】如果你想使用已有的组装文件，同时还需要用 reads 跑 binning/丰度定量：
#
# samples:
#   "My_Sample_01":
#     short_read:
#       r1: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/data/reads/sr_R1.fq.gz"
#       r2: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/data/reads/sr_R2.fq.gz"
#     external_assembly: "/dssg/home/acct-clswfp/clswfp-icdli1/RenTianxin/data/my_assemblies/assembly1.fa"
#

