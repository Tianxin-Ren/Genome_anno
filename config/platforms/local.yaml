# Local workstation deployment. Export these two variables before running, or
# replace the values below with absolute paths on this machine.
runtime:
  name: local

paths:
  conda_envs: "${GENOME_ANNO_CONDA_ENVS}"

# Logical aliases are translated to the legacy keys used by existing modules.
databases:
  root: "${GENOME_ANNO_DATABASES}"
  bakta: "${GENOME_ANNO_DATABASES}/bakta/db-light"
  gtdbtk: "${GENOME_ANNO_DATABASES}/gtdbtk"
  checkm: "${GENOME_ANNO_DATABASES}/checkm"
  checkm2: "${GENOME_ANNO_DATABASES}/checkm2/uniref100.KO.1.dmnd"
  eggnog: "${GENOME_ANNO_DATABASES}/eggnog"
  kofam: "${GENOME_ANNO_DATABASES}/kofam"
  dbcan: "${GENOME_ANNO_DATABASES}/dbcan"
  genomad: "${GENOME_ANNO_DATABASES}/genomad"
  sortmerna: "${GENOME_ANNO_DATABASES}/sortmerna/smr_v4.3_default_db.fasta"
  unified_hmm: "${GENOME_ANNO_DATABASES}/hmm/unified.hmm"
  pfam_hmm: "${GENOME_ANNO_DATABASES}/pfam/Pfam-A.hmm"
  ko_list: "${GENOME_ANNO_DATABASES}/kofam/ko_list"
  kofam_profiles: "${GENOME_ANNO_DATABASES}/kofam/profiles"
  rfam: "${GENOME_ANNO_DATABASES}/rfam/Rfam.cm"
  swissprot: "${GENOME_ANNO_DATABASES}/mmseqs2_db/swiss-prot"
  nr: "${GENOME_ANNO_DATABASES}/nr"
  pfam: "${GENOME_ANNO_DATABASES}/pfam"
  cdd: "${GENOME_ANNO_DATABASES}/cdd"
  biob_hmm: "${GENOME_ANNO_DATABASES}/biob/hmm/biob_core_functions.hmm"
  biob_reference_proteins: "${GENOME_ANNO_DATABASES}/biob/reference_proteins"

# Values are directory names below paths.conda_envs. Absolute paths are also
# accepted. A platform alias overrides the same alias in a module config.
