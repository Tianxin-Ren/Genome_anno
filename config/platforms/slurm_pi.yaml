# Infrastructure paired with profiles/slurm_pi.
# Source: the PI Conda environment listing supplied for this deployment. Most
# databases remain on the DSSG shared filesystem.
runtime:
  name: slurm-pi-cpu
  profile: profiles/slurm_pi
  account: "acct-schhui"
  slurm_account: "acct-schhui"
  partition: "cpu"
  slurm_partition: "cpu"

cluster:
  account: "acct-schhui"
