  plasmid_analysis:
    path: "./plasmid_analysis.yaml"
    enable: False
  abundance:
    path: "./abundance.yaml"
    enable: True
  data_prep:
    path: "./data_prep.yaml"
    enable: True
  phylogeny:
    path: "./phylogeny.yaml"
    enable: False
  visualize:
    path: "./visualize.yaml"
    enable: False
  protein_phylogeny:
    path: "./protein_phylogeny.yaml"
    enable: False




