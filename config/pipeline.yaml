  samples: "./samples.yaml"

# ==============================================================================
# 2. Workflow Modules (Logical Steps & Toggles)
# ==============================================================================
modules:
  preprocess:
    path: "./preprocess.yaml"
    enable: True
  assembly:
    path: "./assembly.yaml"
    enable: True
  binning:
    path: "./binning.yaml"
